<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graph Auths</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef4f7;
      --panel: #ffffff;
      --text: #17212b;
      --muted: #5c6975;
      --border: #c7d3dd;
      --accent: #0f5f8c;
      --accent-2: #0b7da6;
      --ok: #2b7a3d;
      --warn: #975a16;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(180deg, #f6fafc 0%, var(--bg) 100%);
      color: var(--text);
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .shell {
      width: min(720px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(20, 48, 72, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.15;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    button {
      appearance: none;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    button.secondary {
      background: #fff;
      color: var(--accent);
    }

    button:disabled {
      opacity: 0.65;
      cursor: default;
    }

    .status, .config {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      background: #f9fbfc;
      margin-top: 16px;
    }

    .status strong {
      display: block;
      margin-bottom: 8px;
    }

    .ok { color: var(--ok); }
    .warn { color: var(--warn); }

    code {
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      word-break: break-word;
    }

    .kv {
      margin: 8px 0 0;
      display: grid;
      gap: 8px;
    }

    .kv div {
      display: grid;
      gap: 4px;
    }
  </style>
</head>
<body>
  <main>
    <section class="shell">
      <h1>Graph Auths</h1>
      <p>Open Microsoft Graph login, finish the OAuth redirect, and write the token set to a local JSON file.</p>

      <div class="actions">
        <button id="loginBtn" type="button">Open Graph Login</button>
        <button id="refreshBtn" class="secondary" type="button">Refresh Status</button>
      </div>

      <section class="status">
        <strong>Status</strong>
        <div id="statusText">Checking auth status...</div>
      </section>

      <section class="config">
        <strong>Current config</strong>
        <div class="kv">
          <div><span>Redirect URI</span><code id="redirectUri"></code></div>
          <div><span>Output file</span><code id="outputFile"></code></div>
          <div><span>Chrome mode</span><code id="chromeMode"></code></div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const loginBtn = document.getElementById('loginBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const statusText = document.getElementById('statusText');
    const redirectUri = document.getElementById('redirectUri');
    const outputFile = document.getElementById('outputFile');
    const chromeMode = document.getElementById('chromeMode');

    async function refreshStatus() {
      try {
        const res = await fetch('/auth/status');
        const data = await res.json();

        redirectUri.textContent = data.redirectUri;
        outputFile.textContent = data.outputFile;
        chromeMode.textContent =
          data.browserMode + (data.autoOpenBrowser ? ' (auto-open on start)' : ' (manual open)');

        if (data.connected) {
          statusText.innerHTML =
            '<span class="ok">Signed in.</span> Token file exists and the access token is still valid.';
          return;
        }

        statusText.innerHTML =
          '<span class="warn">Not signed in.</span> Use "Open Graph Login" to complete OAuth and write the token file.';
      } catch (err) {
        statusText.textContent = 'Status check failed: ' + err.message;
      }
    }

    async function startLogin() {
      loginBtn.disabled = true;
      statusText.textContent = 'Opening Microsoft Graph login...';
      try {
        const res = await fetch('/auth/login');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login launch failed');
        statusText.textContent = data.message;
      } catch (err) {
        statusText.textContent = err.message;
      } finally {
        loginBtn.disabled = false;
        setTimeout(refreshStatus, 1000);
      }
    }

    loginBtn.addEventListener('click', startLogin);
    refreshBtn.addEventListener('click', refreshStatus);
    refreshStatus();
    setInterval(refreshStatus, 5000);
  </script>
</body>
</html>
